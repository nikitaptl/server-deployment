replicaCount: 1

image:
  repository: nikitaptl/muffin-currency-tracing
  tag: "0.1.0"
  pullPolicy: Always

service:
  name: muffin-currency
  type: ClusterIP
  port: 8083
  targetPort: 8080

podLabels:
  app: muffin-currency

livenessProbe:
  path: /rate?from=PLAIN&to=CHOKOLATE
  port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  path: /rate?from=PLAIN&to=CHOKOLATE
  port: 8080
  initialDelaySeconds: 2
  periodSeconds: 5

env:
  zipkin:
    endpoint: "http://zipkin:9411/api/v2/spans"
  log:
    path: "/logs/muffin-currency.log"